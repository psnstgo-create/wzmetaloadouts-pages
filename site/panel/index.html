<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/favicon_wz.png">
<title>Panel · WZ Meta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070A0E; --panel:#0C1116; --panel2:#10161d; --line:rgba(255,255,255,.07);
  --txt:#EEF2F6; --sec:#AEB8C4; --muted:#828D99;
  --gold:#F0C419; --green:#22C55E; --blue:#3B82F6; --purple:#A855F7; --red:#ff5b5b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Rajdhani',system-ui,sans-serif;
  background-image:radial-gradient(circle at 50% -8%,rgba(240,196,25,.06),transparent 55%)}
.wrap{max-width:1200px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.top h1{font-size:1.35rem;font-weight:800;letter-spacing:.02em;margin:0}
.top h1 .g{color:var(--gold)}
.top .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pz 2s infinite}
@keyframes pz{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.top .upd{margin-left:auto;font-family:'Share Tech Mono',monospace;font-size:.66rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;text-align:right}
.sub{font-family:'Share Tech Mono',monospace;font-size:.68rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:0 0 20px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:44px 22px;text-align:center;color:var(--muted);font-size:.95rem;line-height:1.6}
.sec-h{display:flex;align-items:center;gap:9px;margin:26px 0 12px;font-family:'Share Tech Mono',monospace;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--sec)}
.sec-h::before{content:"";width:5px;height:14px;border-radius:2px;background:var(--acc,var(--gold))}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 15px}
.kpi .l{font-family:'Share Tech Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .n{font-size:1.9rem;font-weight:800;line-height:1.1;margin-top:3px;letter-spacing:-.01em}
.kpi .n small{font-size:.9rem;color:var(--muted);font-weight:600}
.cols{display:grid;gap:12px}
@media(min-width:820px){.cols{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.card h3{margin:0 0 12px;font-size:.95rem;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.card h3 .cnt{margin-left:auto;font-family:'Share Tech Mono',monospace;font-size:.62rem;color:var(--muted)}
.spark{width:100%;height:52px;display:block;margin:2px 0 4px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.bar .bn{font-size:.86rem;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bv{font-family:'Share Tech Mono',monospace;font-size:.78rem;color:var(--txt)}
.bar .bt{grid-column:1/-1;height:7px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.bar .bf{height:100%;border-radius:4px;background:var(--acc,var(--gold))}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:'Share Tech Mono',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.q{white-space:normal;color:var(--txt);max-width:230px;overflow:hidden;text-overflow:ellipsis}
td.num{text-align:right;font-family:'Share Tech Mono',monospace;color:var(--sec)}
td.num b{color:var(--txt)}
.tbl-wrap{overflow-x:auto}
.err{color:var(--red);font-size:.8rem;margin-top:10px;font-family:'Share Tech Mono',monospace}
a.home{color:var(--muted);text-decoration:none;font-size:.8rem;font-family:'Share Tech Mono',monospace}
a.home:hover{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="dot"></span>
    <h1>Panel <span class="g">WZ Meta</span></h1>
    <span class="upd" id="upd"></span>
  </div>
  <p class="sub" id="sub">Métricas privadas · últimos 28 días · GA4 + Search Console</p>

  <div id="content"></div>

  <div style="margin-top:26px"><a class="home" href="/">← volver al sitio</a></div>
</div>

<script>
const $ = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const fmt = n => { n = +n || 0; return n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(n>=1e4?0:1).replace('.0','')+'k' : String(n); };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function sparkline(serie, key, color){
  if(!serie || serie.length < 2) return '';
  const w = 300, h = 52, p = 3;
  const vals = serie.map(d => +d[key] || 0);
  const mx = Math.max(...vals, 1);
  const step = (w - p*2) / (serie.length - 1);
  const pts = vals.map((v,i) => [p + i*step, h - p - (v/mx)*(h - p*2)]);
  const line = pts.map((pt,i) => (i?'L':'M') + pt[0].toFixed(1) + ' ' + pt[1].toFixed(1)).join(' ');
  const area = `M${pts[0][0].toFixed(1)} ${h} ` + pts.map(pt=>'L'+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ') + ` L${pts[pts.length-1][0].toFixed(1)} ${h} Z`;
  const id = 'g'+Math.random().toString(36).slice(2,7);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="tendencia">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function kpi(l, n, sm){ const e = $('div','kpi'); e.innerHTML = `<div class="l">${l}</div><div class="n">${n}${sm?` <small>${sm}</small>`:''}</div>`; return e; }

function barsCard(title, items, nameKey, valKey, acc){
  const card = $('div','card'); card.style.setProperty('--acc', acc);
  const mx = Math.max(...items.map(i=>+i[valKey]||0), 1);
  const rows = items.map(i => `<div class="bar"><span class="bn">${esc(i[nameKey]||'—')}</span><span class="bv">${fmt(i[valKey])}</span><span class="bt"><span class="bf" style="width:${Math.max(2,(+i[valKey]||0)/mx*100)}%"></span></span></div>`).join('');
  card.innerHTML = `<h3>${esc(title)}<span class="cnt">${items.length}</span></h3><div class="bars">${rows||'<span class="bn">Sin datos</span>'}</div>`;
  return card;
}

function tableCard(title, items, cols){
  const card = $('div','card');
  const head = cols.map(c=>`<th${c.num?' style="text-align:right"':''}>${esc(c.h)}</th>`).join('');
  const body = items.map(it => '<tr>' + cols.map(c => c.num
      ? `<td class="num">${c.bold?'<b>'+fmt(it[c.k])+'</b>':(c.raw?esc(it[c.k]):fmt(it[c.k]))}</td>`
      : `<td class="q">${esc(it[c.k])}</td>`).join('') + '</tr>').join('');
  card.innerHTML = `<h3>${esc(title)}<span class="cnt">${items.length}</span></h3><div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  return card;
}

function render(d){
  const c = document.getElementById('content'); c.innerHTML='';
  document.getElementById('upd').textContent = d.generado ? ('Actualizado ' + d.generado.replace('T',' ').replace('Z',' UTC')) : '';

  if(!d.ga4 && !d.gsc){
    c.appendChild($('div','empty','<b>Panel listo, esperando datos.</b><br>Configurá la cuenta de servicio de Google (GA_SA_JSON + GA4_PROPERTY_ID) para que empiece a mostrar tus métricas.'));
    return;
  }

  // ── Search Console ──
  if(d.gsc){
    const g = d.gsc, t = g.total||{};
    c.appendChild($('div','sec-h','Search Console — búsquedas en Google'));
    const k = $('div','grid kpis');
    k.append(kpi('Clics', fmt(t.clics)), kpi('Impresiones', fmt(t.impresiones)), kpi('CTR', (t.ctr||0)+'%'), kpi('Posición media', t.posicion||'—'));
    c.appendChild(k);
    if(g.serie && g.serie.length>1){ const sc=$('div','card'); sc.style.marginTop='12px'; sc.innerHTML=`<h3>Clics por día</h3>${sparkline(g.serie,'clics','#F0C419')}`; c.appendChild(sc); }
    const cols = $('div','cols'); cols.style.marginTop='12px';
    cols.appendChild(tableCard('Keywords que te buscan', (g.keywords||[]).slice(0,15), [
      {h:'Consulta',k:'q'},{h:'Clics',k:'clics',num:true,bold:true},{h:'Impr.',k:'impresiones',num:true},{h:'Pos.',k:'posicion',num:true,raw:true}]));
    cols.appendChild(tableCard('Páginas top (búsqueda)', (g.paginas||[]).slice(0,12), [
      {h:'Página',k:'url'},{h:'Clics',k:'clics',num:true,bold:true},{h:'Impr.',k:'impresiones',num:true}]));
    c.appendChild(cols);
  }

  // ── GA4 ──
  if(d.ga4){
    const a = d.ga4;
    const sh=$('div','sec-h','Analytics — visitas al sitio'); sh.style.setProperty('--acc','#22C55E'); c.appendChild(sh);
    const k = $('div','grid kpis');
    k.append(kpi('Usuarios', fmt(a.usuarios)), kpi('Sesiones', fmt(a.sesiones)), kpi('Vistas de página', fmt(a.vistas)),
      kpi('Móvil', (()=>{const m=(a.dispositivos||[]).find(x=>/mobile/i.test(x.tipo));const tot=(a.dispositivos||[]).reduce((s,x)=>s+(+x.usuarios||0),0)||1;return m?Math.round(m.usuarios/tot*100)+'%':'—';})()));
    c.appendChild(k);
    if(a.serie && a.serie.length>1){ const sc=$('div','card'); sc.style.marginTop='12px'; sc.innerHTML=`<h3>Usuarios por día</h3>${sparkline(a.serie,'usuarios','#22C55E')}`; c.appendChild(sc); }
    const cols = $('div','cols'); cols.style.marginTop='12px';
    cols.appendChild(barsCard('De dónde llegan', (a.fuentes||[]).slice(0,8), 'nombre','sesiones','#3B82F6'));
    cols.appendChild(barsCard('Países', (a.paises||[]).slice(0,8), 'pais','usuarios','#A855F7'));
    c.appendChild(cols);
    const cols2 = $('div','cols'); cols2.style.marginTop='12px';
    cols2.appendChild(tableCard('Páginas más vistas', (a.paginas||[]).slice(0,12), [{h:'Página',k:'path'},{h:'Vistas',k:'vistas',num:true,bold:true}]));
    cols2.appendChild(barsCard('Dispositivos', (a.dispositivos||[]).slice(0,5), 'tipo','usuarios','#F0C419'));
    c.appendChild(cols2);
  }

  if(d.errores && d.errores.length) c.appendChild($('div','err','⚠ ' + d.errores.map(esc).join(' · ')));
}

fetch('/panel/data.json?v='+Date.now(),{cache:'no-cache'})
  .then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(render)
  .catch(()=>{ document.getElementById('content').appendChild($('div','empty','<b>Panel listo, esperando datos.</b><br>Configurá la cuenta de servicio de Google para ver tus métricas.')); });
</script>
</body></html>
