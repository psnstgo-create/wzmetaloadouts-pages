<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Página no encontrada | WZ Meta</title>
  <style>
    :root{color-scheme:dark;--bg:#070a0e;--panel:#0c1116;--line:rgba(255,255,255,.1);--text:#eef2f6;--muted:#9aa4af;--gold:#f0c419;--orange:#ff8a00}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,rgba(255,138,0,.12),transparent 42%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(560px,100%);padding:42px 30px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.42)}
    .code{margin:0;color:var(--gold);font-size:clamp(4rem,18vw,7rem);font-weight:900;line-height:.9;letter-spacing:-.06em}
    h1{margin:22px 0 10px;font-size:clamp(1.5rem,5vw,2.2rem)}
    p{margin:0 auto 28px;max-width:42ch;color:var(--muted);line-height:1.6}
    a{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:0 22px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--orange));color:#090b0e;font-weight:800;text-decoration:none}
    a:focus-visible{outline:3px solid #fff;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Página no encontrada</h1>
    <p>La dirección que abriste no existe o ya no está disponible.</p>
    <a href="/">Volver a WZ Meta</a>
  </main>
</body>
</html>
