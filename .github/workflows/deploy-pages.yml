name: Sync private source and deploy Pages

# Construye el sitio desde el repo privado y lo publica en CLOUDFLARE PAGES
# (proyecto "wzmetaloadouts") via wrangler. Reemplaza el deploy de GitHub Pages,
# que tenia el bug intermitente "deployment_queued". Cloudflare Pages es estable.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-and-deploy-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fuente
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: psnstgo-create/wzmetaloadouts-web
          ref: main
          path: source
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false

      - name: Preparar Python para estado de servidores
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright para estado de servidores
        working-directory: source
        timeout-minutes: 5
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install chromium --with-deps

      - name: Actualizar estado de servidores
        working-directory: source
        run: python server_status_checker.py
        continue-on-error: true

      # Streams de Warzone en vivo (Twitch). Corre acá (repo PUBLICO, minutos
      # de Actions GRATIS) en vez del repo privado, cada 15 min con el sync.
      # Necesita los secrets TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET en ESTE repo.
      - name: Actualizar streams en vivo (Twitch)
        working-directory: source
        env:
          TWITCH_CLIENT_ID:     ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python twitch_live.py
        continue-on-error: true

      # Pre-render SEO + sitemap: se HORNEAN acá (repo PUBLICO, Actions GRATIS)
      # en vez del repo privado. Playwright ya está instalado (server-status).
      # Hornea el HTML renderizado (tier list, stats, "Míralo en acción" + schema
      # de video) para que Google lo vea crudo. No commitea: el artefacto
      # desplegado queda horneado; prepare_public_site.py lo copia tal cual.
      - name: Sincronizar numero de temporada en textos
        working-directory: source
        continue-on-error: true
        run: python _build/sync_temporada_texto.py

      - name: Pre-render SEO (fichas + home + catalogo)
        working-directory: source
        timeout-minutes: 9
        continue-on-error: true
        run: python _build/prerender.py

      - name: Regenerar sitemap
        working-directory: source
        continue-on-error: true
        run: python _build/build_sitemap.py

      - name: Checkout repositorio publico (para el artefacto/backup)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: target

      - name: Preparar y validar artefacto publico
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
        run: >-
          python source/_build/prepare_public_site.py
          --output "$RUNNER_TEMP/public-site"
          --omit-cname

      - name: Sincronizar solo el sitio validado
        run: >-
          rsync -a --delete
          "$RUNNER_TEMP/public-site/"
          target/site/

      - name: Detectar cambios en el artefacto
        id: sync
        working-directory: target
        run: |
          git config user.name "WZ Meta Publisher"
          git config user.email "bot@wzmetaloadouts.com"
          git add --all -- site
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "El artefacto publico no cambio."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=$(git -C ../source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "El artefacto publico cambio; se desplegara a Cloudflare Pages."
          fi

      # Deploy a Cloudflare Pages (estable, sin el bug de GitHub Pages).
      - name: Deploy a Cloudflare Pages
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy target/site
          --project-name=wzmetaloadouts
          --branch=main
          --commit-dirty=true

      # Guarda el artefacto en el repo (backup/historial) SOLO si el deploy salio
      # bien. Si el deploy falla, no commitea y la proxima corrida reintenta.
      - name: Guardar artefacto (backup, si el deploy funciono)
        if: steps.sync.outputs.changed == 'true'
        working-directory: target
        env:
          SRC_SHA: ${{ steps.sync.outputs.source_sha }}
        run: |
          git add --all -- site
          git commit -m "Deploy: artefacto publico a Cloudflare Pages (${SRC_SHA:0:12})"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            sleep 5
          done
