name: Sync private source and deploy Pages

# Construye el sitio desde el repo privado y lo publica en CLOUDFLARE PAGES
# (proyecto "wzmetaloadouts") via wrangler. Reemplaza el deploy de GitHub Pages,
# que tenia el bug intermitente "deployment_queued". Cloudflare Pages es estable.

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: sync-and-deploy-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fuente
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: psnstgo-create/wzmetaloadouts-web
          ref: main
          path: source
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false

      - name: Checkout repositorio publico (artefacto y cache operativo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: target

      # El radar se genera dentro del checkout privado pero persiste en el
      # artefacto público. Recuperamos la última copia válida para no volver a
      # consultar YouTube en cada deploy de 15 minutos.
      - name: Recuperar radar de contenido anterior
        shell: bash
        run: |
          candidate="target/site/youtube-trends.json"
          if [[ ! -s "$candidate" ]]; then
            echo "No hay radar anterior; se usará el inicial de la fuente."
            exit 0
          fi
          if python - "$candidate" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("schemaVersion") != 1 or not isinstance(data.get("ranking"), list):
              raise SystemExit(1)
          PY
          then
            cp "$candidate" source/youtube-trends.json
            echo "Radar anterior recuperado."
          else
            echo "Radar anterior inválido; se conserva el inicial."
          fi

      - name: Preparar Python para estado de servidores
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright para estado de servidores
        working-directory: source
        timeout-minutes: 5
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install chromium --with-deps

      - name: Actualizar estado de servidores
        working-directory: source
        run: python server_status_checker.py
        continue-on-error: true

      # Streams de Warzone en vivo (Twitch). Corre acá (repo PUBLICO, minutos
      # de Actions GRATIS) en vez del repo privado, cada 15 min con el sync.
      # Necesita los secrets TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET en ESTE repo.
      - name: Actualizar streams en vivo (Twitch)
        working-directory: source
        env:
          TWITCH_CLIENT_ID:     ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python twitch_live.py
        continue-on-error: true

      # GitHub no garantiza que un cron se ejecute en el minuto exacto. Decidimos
      # por antigüedad del último radar válido: así una ejecución retrasada lo
      # refresca, sin consumir la cuota de YouTube en cada sincronización.
      - name: Decidir actualización del radar
        id: radar_due
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)
          event_name = os.environ.get("EVENT_NAME", "")
          radar_path = Path("target/site/youtube-trends.json")
          state_path = Path("target/radar-refresh-state.json")
          due, reason = True, "sin radar válido"

          try:
              data = json.loads(radar_path.read_text(encoding="utf-8"))
              generated_at = datetime.fromisoformat(
                  str(data.get("generatedAt", "")).replace("Z", "+00:00")
              )
              age_hours = (now - generated_at.astimezone(timezone.utc)).total_seconds() / 3600
              if data.get("method") == "recent_search_sample" and age_hours < 20:
                  due, reason = False, f"radar vigente ({age_hours:.1f} h)"
              else:
                  reason = f"radar vencido ({age_hours:.1f} h)"
          except Exception:
              pass

          # Si la API externa falla, limitamos los reintentos a uno cada seis
          # horas para no agotar cuota ni llenar el historial de despliegues.
          try:
              state = json.loads(state_path.read_text(encoding="utf-8"))
              attempted_at = datetime.fromisoformat(
                  str(state.get("attemptedAt", "")).replace("Z", "+00:00")
              )
              attempt_age = (now - attempted_at.astimezone(timezone.utc)).total_seconds() / 3600
              if due and event_name != "workflow_dispatch" and attempt_age < 6:
                  due, reason = False, f"reintento diferido ({attempt_age:.1f} h)"
          except Exception:
              pass

          if event_name == "workflow_dispatch":
              due, reason = True, "ejecución manual"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"due={'true' if due else 'false'}\n")
              output.write(f"reason={reason}\n")
          print(f"Radar: {reason}. Actualizar: {due}")
          PY

      # Muestra equilibrada de las 20 armas del meta: cuatro consultas semanales
      # por arma (80 búsquedas). Solo corre cuando el cache está vencido.
      - name: Actualizar radar de armas (YouTube oficial)
        if: steps.radar_due.outputs.due == 'true'
        working-directory: source
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python _build/youtube_trends.py --min-age-hours 20
        continue-on-error: true

      - name: Registrar intento del radar
        if: always() && steps.radar_due.outputs.due == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          Path("target/radar-refresh-state.json").write_text(
              json.dumps({"attemptedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")}) + "\n",
              encoding="utf-8",
          )
          PY

      # Pre-render SEO + sitemap: se HORNEAN acá (repo PUBLICO, Actions GRATIS)
      # en vez del repo privado. Playwright ya está instalado (server-status).
      # Hornea el HTML renderizado (tier list, stats, "Míralo en acción" + schema
      # de video) para que Google lo vea crudo. No commitea: el artefacto
      # desplegado queda horneado; prepare_public_site.py lo copia tal cual.
      - name: Sincronizar numero de temporada en textos
        working-directory: source
        continue-on-error: true
        run: python _build/sync_temporada_texto.py

      - name: Pre-render SEO (fichas + home + catalogo)
        working-directory: source
        timeout-minutes: 9
        continue-on-error: true
        run: python _build/prerender.py

      - name: Regenerar sitemap
        working-directory: source
        continue-on-error: true
        run: python _build/build_sitemap.py

      - name: Preparar y validar artefacto publico
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
        run: >-
          python source/_build/prepare_public_site.py
          --output "$RUNNER_TEMP/public-site"
          --omit-cname

      - name: Sincronizar solo el sitio validado
        run: >-
          rsync -a --delete
          "$RUNNER_TEMP/public-site/"
          target/site/

      - name: Detectar cambios en el artefacto
        id: sync
        working-directory: target
        run: |
          git config user.name "WZ Meta Publisher"
          git config user.email "bot@wzmetaloadouts.com"
          git add --all -- site radar-refresh-state.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "El artefacto publico no cambio."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=$(git -C ../source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "El artefacto publico cambio; se guardara antes de desplegar."
          fi

      # Primero guarda el artefacto. Nunca se despliega un radar nuevo que no
      # pueda persistir: así un siguiente sync no puede restaurar una muestra
      # antigua por una carrera de pushes.
      - name: Guardar artefacto antes del deploy
        if: steps.sync.outputs.changed == 'true'
        working-directory: target
        env:
          SRC_SHA: ${{ steps.sync.outputs.source_sha }}
        run: |
          git add --all -- site radar-refresh-state.json
          git commit -m "Deploy: artefacto publico a Cloudflare Pages (${SRC_SHA:0:12})"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            sleep 5
          done
          echo "No se pudo guardar el artefacto tras 5 intentos." >&2
          exit 1

      # Deploy a Cloudflare Pages (estable, sin el bug de GitHub Pages). Solo
      # corre después de que un artefacto cambiado quede respaldado con éxito.
      - name: Deploy a Cloudflare Pages
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy target/site
          --project-name=wzmetaloadouts
          --branch=main
          --commit-dirty=true
