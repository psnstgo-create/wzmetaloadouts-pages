name: Sync private source and deploy Pages

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-and-deploy-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - name: Checkout fuente
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: psnstgo-create/wzmetaloadouts-web
          ref: main
          path: source
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false

      - name: Preparar Python para estado de servidores
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright para estado de servidores
        working-directory: source
        timeout-minutes: 5
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install chromium --with-deps

      - name: Actualizar estado de servidores
        working-directory: source
        run: python server_status_checker.py
        continue-on-error: true

      - name: Checkout repositorio publico
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: target

      - name: Preparar y validar artefacto publico
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
        run: >-
          python source/_build/prepare_public_site.py
          --output "$RUNNER_TEMP/public-site"
          --omit-cname

      - name: Sincronizar solo el sitio validado
        run: >-
          rsync -a --delete
          "$RUNNER_TEMP/public-site/"
          target/site/

      # Detecta si el artefacto cambio, pero NO commitea todavia: el commit se
      # hace SOLO si el deploy tuvo exito (ver ultimo paso). Asi, si el deploy
      # falla, la proxima corrida re-detecta el cambio y reintenta solo.
      - name: Detectar cambios en el artefacto
        id: sync
        working-directory: target
        run: |
          git config user.name "WZ Meta Publisher"
          git config user.email "bot@wzmetaloadouts.com"
          git add --all -- site
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "El artefacto publico no cambio."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=$(git -C ../source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "El artefacto publico cambio; se desplegara."
          fi

      - name: Configurar Pages
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Subir artefacto publico
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: target/site

      # Deploy con FAIL-FAST (5 min, no 15) + reintento automatico. Si GitHub
      # Pages tiene un hipo de "deployment_queued", el intento corta rapido y el
      # reintento crea un deployment nuevo (recupera hipos breves sin colgarse).
      - name: Publicar en GitHub Pages (intento 1)
        id: deploy1
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Publicar en GitHub Pages (reintento)
        id: deployment
        if: >-
          (steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
          && steps.deploy1.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # Recien ahora commitea el artefacto, y SOLO si el deploy salio bien. Si
      # ambos intentos fallaron, no se commitea: la proxima corrida (cada 15 min)
      # re-detecta el cambio y reintenta sola, sin dejar el sitio desactualizado.
      - name: Confirmar artefacto (solo si el deploy tuvo exito)
        if: >-
          steps.sync.outputs.changed == 'true'
          && (steps.deploy1.outcome == 'success' || steps.deployment.outcome == 'success')
        working-directory: target
        env:
          SRC_SHA: ${{ steps.sync.outputs.source_sha }}
        run: |
          git add --all -- site
          git commit -m "Deploy: actualizar artefacto publico (${SRC_SHA:0:12})"
          git push origin main
