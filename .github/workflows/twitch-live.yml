name: Refresh public Twitch streams

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-twitch-streams
  cancel-in-progress: false

jobs:
  refresh:
    # Standard public runner only. Never allocate a private-repository runner.
    if: github.repository == 'psnstgo-create/wzmetaloadouts-pages' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            automation
          sparse-checkout-cone-mode: false
      - name: Refresh only the Twitch feed
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/refresh_twitch.py
