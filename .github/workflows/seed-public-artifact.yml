name: Seed public artifact

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fuente publica actual
        uses: actions/checkout@v4
        with:
          repository: psnstgo-create/wzmetaloadouts-web
          ref: main
          path: source
          persist-credentials: false

      - name: Checkout repositorio de artefacto
        uses: actions/checkout@v4
        with:
          path: target

      - name: Preparar y validar artefacto sin dominio
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
        run: >-
          python source/_build/prepare_public_site.py
          --output "$RUNNER_TEMP/public-site"

      - name: Mantener libre el dominio de produccion
        run: |
          rm -- "$RUNNER_TEMP/public-site/CNAME"
          test ! -e "$RUNNER_TEMP/public-site/CNAME"

      - name: Sincronizar solo archivos publicos
        run: >-
          rsync -a --delete
          "$RUNNER_TEMP/public-site/"
          target/site/

      - name: Crear commit inicial del artefacto
        working-directory: target
        run: |
          git config user.name "WZ Meta Publisher"
          git config user.email "bot@wzmetaloadouts.com"
          git add --all -- site
          git commit -m "Deploy: artefacto publico inicial"
          git push origin main
