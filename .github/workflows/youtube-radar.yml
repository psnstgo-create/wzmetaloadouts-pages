name: Refresh public YouTube radar

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-youtube-radar
  cancel-in-progress: false

jobs:
  refresh:
    # Never allocate a runner in a private repository or a fork.
    if: github.repository == 'psnstgo-create/wzmetaloadouts-pages' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            automation
            site/youtube-trends.json
          sparse-checkout-cone-mode: false
      - name: Collect, validate and publish only the radar data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/refresh_youtube_radar.py
