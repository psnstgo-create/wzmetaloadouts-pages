name: Transfer Twitch configuration securely
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    if: github.repository == 'psnstgo-create/wzmetaloadouts-pages' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt Twitch credentials for the owned Cloudflare Worker
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const key="-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA2M7WNytWV58A/pnkL/YU\nJ9OK8pCVQMEeAZdkNZI22m0Q6rDPa4S62bNXsOPE2D0o7SsfYB3PPae6udZaO/6R\nyZvfbIegU22zEv/Fnb3ayj2ilUFCJ/XdoRcziL+u1ROGF4MMfLzGkcxCOOAJZfoP\njOsbHuymLm8dVj7ONTGbyYCPvosY7P9ggp5OvcT4aQKFks96hPFvmtS8UExxXSVJ\no+j4+k58Otplvuihh2peuM8mM/MPgmk7lZK+HMFi75Tjcs2bywL5RJfdRwWZRmPg\nGhWmd25n/82c9zp9zuudC3LrzhK3FdB6efEEfiDO6A7iCK4TKd1H7vHbqeEPYFae\na9+iIbOuAkt9k1HDxedmjM7RwiWhepcytGZEmLgKC04iIgS3/rUwaLrSgx0kd2fQ\n/Blb/k4sr1fnTHD7EjJDT4xpXe4jj8veAwC1O5Jdx0UtdIxs5phVLBTtJHikMlIb\n2eWIRQiFlyeQPuY/XmMJGVIIuop6Do8wwJ3QRXjkOlDECCPkYuxuqdHe8ozhVpQn\niaoRikG0+S0wV+eTdLXpyyhbb2k39+/vINNIgEK6CueOTnMmiOy7PG49V5xnysex\nbvP6PHqsRrKkn7menu9sfJ5R+DMIF4rfCXH/FpO0sRzA69tEcbQZ29cR8q+cTuIN\naXQWo/Uvg/kdYf9CmcEN6AMCAwEAAQ==\n-----END PUBLIC KEY-----\n";
          const data={TWITCH_CLIENT_ID:process.env.TWITCH_CLIENT_ID,TWITCH_CLIENT_SECRET:process.env.TWITCH_CLIENT_SECRET};
          if(!data.TWITCH_CLIENT_ID || !data.TWITCH_CLIENT_SECRET) throw new Error('Missing Twitch configuration');
          fs.writeFileSync('twitch-config.enc',crypto.publicEncrypt({key,oaepHash:'sha256'},Buffer.from(JSON.stringify(data))));
          console.log('Encrypted configuration only; plaintext is never written or logged.');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-twitch-config
          path: twitch-config.enc
          retention-days: 1
